services:
  db:
    image: postgres:16
    container_name: estoque_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estoque_user
      POSTGRES_PASSWORD: estoque_pass
      POSTGRES_DB: estoque_db
    ports:
      - "5432:5432"
    volumes:
      - estoque_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque_user -d estoque_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  estoque_pgdata:
